plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.finlifenative'
version = '1.0.0'

android {
  namespace "expo.modules.finlifenative"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lint {
    abortOnError false
  }
}

dependencies {
  // Bundled Latin OCR: works offline on the first scan, without a model download.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  // Single-threaded to avoid competing with on-device chat for all CPU cores.
  implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
}
